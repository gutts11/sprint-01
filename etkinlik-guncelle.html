<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kampüs Etkinlikleri - Etkinlik Güncelle</title>
</head>
<body>
    <header>
        <h1>Etkinlik Güncelle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a> |
            <a href="etkinlikler.html">Etkinlikler</a> |
            <a href="etkinlik-detay.html">Detay</a> |
            <a href="etkinlik-ekle.html">Ekle</a> |
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>

    <main>
        <form action="#" method="post">
            <p>
                <label for="ad">Etkinlik Adı</label><br>
                <input type="text" id="ad" name="ad" value="Kariyer Günleri 2026" required>
            </p>

            <p>
                <label for="kategori">Kategori</label><br>
                <select id="kategori" name="kategori" required>
                    <option value="">Seçiniz</option>
                    <option value="Seminer" selected>Seminer</option>
                    <option value="Atölye">Atölye</option>
                    <option value="Konferans">Konferans</option>
                </select>
            </p>

            <p>
                <label for="tarih">Tarih / Saat</label><br>
                <input type="datetime-local" id="tarih" name="tarih" value="2026-10-12T14:00" required>
            </p>

            <p>
                <label for="yer">Yer</label><br>
                <input type="text" id="yer" name="yer" value="A Blok Konferans Salonu" required>
            </p>

            <p>
                <label for="aciklama">Açıklama</label><br>
                <textarea id="aciklama" name="aciklama" rows="4" cols="40" required>Sektör temsilcileri ile tanışma ve kariyer fırsatlarını değerlendirme etkinliği.</textarea>
            </p>

            <p>
                <button type="submit">Güncelle</button>
            </p>
        </form>
    </main>

    <footer>
        <p>Muhammed Alperen Turan · 2011012045 · 2026</p>
    </footer>
</body>
</html>
